# Docker 镜像加速配置说明
# 1. 登录阿里云容器镜像服务控制台
# 2. 进入"镜像加速器"页面
# 3. 复制加速器地址（如 https://xxxx.mirror.aliyuncs.com）
# 4. 在 Docker Desktop 中配置该地址
# 5. 重启 Docker 服务

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vibe_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vibe_user
      POSTGRES_PASSWORD: vibe_password
      POSTGRES_DB: vibe_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=zh_CN.UTF-8 --lc-ctype=zh_CN.UTF-8"
      LANG: zh_CN.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: vibe_nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/uploads:/usr/share/nginx/html/uploads
    restart: unless-stopped

  python:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: vibe_python
    ports:
      - "50051:50051"
    volumes:
      - ./python:/app
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=vibe_user
      - POSTGRES_PASSWORD=vibe_password
      - POSTGRES_DB=vibe_db
    depends_on:
      - postgres
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vibe_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
